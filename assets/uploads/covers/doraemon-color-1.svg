<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 460" width="320" height="460">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0288d1" />
      <stop offset="100%" stop-color="#01579b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="320" height="460" fill="url(#grad)" rx="8" />

  <!-- Manga Frame Border -->
  <rect x="12" y="12" width="296" height="436" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2" rx="4" />
  <rect x="16" y="16" width="288" height="428" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1" />

  <!-- Top Badge -->
  <rect x="24" y="24" width="130" height="24" rx="4" fill="rgba(0,0,0,0.4)" />
  <text x="89" y="40" fill="#ffeb3b" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" letter-spacing="1.5">COLOR SPECIAL</text>

  <!-- Symbol Emblem -->
  <circle cx="160" cy="180" r="75" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)" stroke-width="2" />
  <circle cx="160" cy="180" r="60" fill="rgba(0,0,0,0.15)" />
  <text x="160" y="200" fill="#ffeb3b" font-size="52" text-anchor="middle" font-family="'Segoe UI Symbol', Arial">🔔</text>

  <!-- Comic Title Box -->
  <rect x="24" y="275" width="272" height="110" rx="6" fill="rgba(0,0,0,0.55)" filter="url(#shadow)" />

  <text x="160" y="312" fill="#ffffff" font-family="'Arial Black', Arial, sans-serif" font-size="20" font-weight="900" text-anchor="middle" letter-spacing="0.5">DORAEMON</text>
  <line x1="60" y1="324" x2="260" y2="324" stroke="#ffeb3b" stroke-width="2" />
  <text x="160" y="345" fill="#ffeb3b" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">TRANH TRUYỆN MÀU - TẬP 1</text>
  <text x="160" y="368" fill="#e0e0e0" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" letter-spacing="1">TÁC GIẢ: FUJIKO F. FUJIO</text>

  <!-- Publisher Tag -->
  <rect x="24" y="400" width="272" height="24" rx="4" fill="rgba(255,255,255,0.92)" />
  <text x="160" y="416" fill="#1a1a1a" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" letter-spacing="1">NXB KIM ĐỒNG</text>
</svg>